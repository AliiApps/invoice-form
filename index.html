<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>فاتورة جديدة</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Telegram hands us its theme; these are only fallbacks */
  :root{
    --bg:var(--tg-theme-bg-color,#fff);
    --text:var(--tg-theme-text-color,#1d1d1f);
    --hint:var(--tg-theme-hint-color,#8e8e93);
    --field:var(--tg-theme-secondary-bg-color,#f2f2f4);
    --accent:var(--tg-theme-button-color,#2481cc);
    --accent-text:var(--tg-theme-button-text-color,#fff);
    --danger:var(--tg-theme-destructive-text-color,#e53935);
  }
  *{box-sizing:border-box}
  body{margin:0;padding:16px 16px 96px;background:var(--bg);color:var(--text);
       font:16px/1.4 -apple-system,"SF Pro Text","Segoe UI",sans-serif}
  h1{font-size:22px;margin:4px 0 18px}
  label,.cap{display:block;font-size:13px;color:var(--hint);margin:16px 0 6px}
  select,input{width:100%;font:inherit;color:var(--text);background:var(--field);
       border:0;border-radius:12px;padding:12px 14px;outline:none;appearance:none}
  input:focus,select:focus{box-shadow:0 0 0 2px var(--accent)}
  .num{direction:ltr;text-align:left}

  .item{padding:10px 0 12px;border-bottom:1px solid var(--field)}
  .item:first-child{padding-top:0}
  .line{display:flex;gap:8px;align-items:center}
  .line + .line{margin-top:8px}
  .work{flex:1 1 auto;min-width:0}
  .qty{flex:0 0 26%}
  .price{flex:1 1 auto;min-width:0}
  .mini{font-size:11px;color:var(--hint);margin:0 4px 3px}
  .field{display:flex;flex-direction:column;min-width:0}
  .x{flex:0 0 40px;height:44px;border:0;border-radius:12px;background:var(--field);
     color:var(--danger);font-size:18px}
  .x:disabled{opacity:.3}
  .rowtotal{margin-top:6px;font-size:13px;color:var(--hint);display:flex;justify-content:space-between}
  .rowtotal b{color:var(--text);font-weight:600;direction:ltr}

  .add{width:100%;border:0;border-radius:12px;padding:12px;background:var(--field);
       color:var(--accent);font:inherit;font-weight:600;margin-top:10px}

  .disc{display:flex;gap:8px}
  .disc input{flex:1 1 auto;min-width:0}
  .seg{flex:0 0 auto;display:flex;background:var(--field);border-radius:12px;padding:3px}
  .seg button{border:0;background:transparent;color:var(--hint);font:inherit;font-weight:600;
       padding:0 14px;border-radius:9px;min-width:48px}
  .seg button.on{background:var(--accent);color:var(--accent-text)}

  .sum{margin-top:20px;padding:14px;background:var(--field);border-radius:14px}
  .sum div{display:flex;justify-content:space-between;padding:3px 0}
  .sum span:last-child{direction:ltr}
  .sum .k{color:var(--hint)}
  .sum .grand{font-weight:700;font-size:19px;border-top:1px solid var(--hint);
       margin-top:6px;padding-top:9px}

  .err{color:var(--danger);font-size:14px;min-height:20px;margin-top:10px}
  #submit{position:fixed;left:16px;right:16px;bottom:16px;border:0;border-radius:14px;
       padding:15px;background:var(--accent);color:var(--accent-text);font:inherit;font-weight:700}
  #newClient{margin-top:8px}
  .hidden{display:none !important}
</style>
</head>
<body>
<h1>🧾 فاتورة جديدة</h1>

<label for="client">العميل</label>
<select id="client"></select>
<input id="newClient" class="hidden" placeholder="اسم العميل الجديد" autocomplete="off">

<label for="currency">العملة</label>
<select id="currency">
  <option>OMR</option><option>USD</option><option>AED</option><option>SAR</option>
</select>

<span class="cap">البنود</span>
<div id="rows"></div>
<button class="add" id="add" type="button">➕ Add</button>

<label for="discount">خصم (اختياري)</label>
<div class="disc">
  <input id="discount" class="num" placeholder="0" inputmode="decimal" autocomplete="off">
  <div class="seg" role="group">
    <button type="button" data-mode="percent" class="on">%</button>
    <button type="button" data-mode="amount" id="modeAmount">مبلغ</button>
  </div>
</div>

<div class="sum">
  <div><span class="k">المجموع الفرعي</span><span id="subtotal"></span></div>
  <div id="discRow" class="hidden"><span class="k" id="discLabel">الخصم</span><span id="discAmt"></span></div>
  <div class="grand"><span>الإجمالي</span><span id="total"></span></div>
</div>
<div class="err" id="err"></div>

<button id="submit" type="button">إرسال</button>

<script>
  const tg = window.Telegram && Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
  const $ = id => document.getElementById(id);

  // Saved clients come in the URL fragment (#c=<base64url JSON>): the fragment
  // never leaves the phone, so no client name is ever stored on this page.
  function savedClients() {
    try {
      const raw = new URLSearchParams(location.hash.slice(1)).get("c");
      if (!raw) return [];
      const b64 = raw.replace(/-/g, "+").replace(/_/g, "/");
      const bytes = Uint8Array.from(atob(b64), ch => ch.charCodeAt(0));
      const list = JSON.parse(new TextDecoder().decode(bytes));
      return Array.isArray(list) ? list.filter(n => typeof n === "string") : [];
    } catch (e) { return []; }
  }

  const NEW = "__new__";
  const client = $("client"), newClient = $("newClient");
  for (const name of savedClients()) client.add(new Option(name, name));
  client.add(new Option("➕ New client", NEW));
  const syncClient = () => newClient.classList.toggle("hidden", client.value !== NEW);
  client.addEventListener("change", () => { syncClient(); if (client.value === NEW) newClient.focus(); });
  syncClient();

  const currency = $("currency"), rows = $("rows");
  const money = v => currency.value + " " + v.toLocaleString("en-US", {
    minimumFractionDigits: currency.value === "OMR" ? 3 : 2,
    maximumFractionDigits: currency.value === "OMR" ? 3 : 2 });

  // Arabic-Indic digits and the Arabic decimal separator are accepted too
  function num(s) {
    s = String(s).trim()
      .replace(/[٠-٩]/g, d => d.charCodeAt(0) - 1632)
      .replace(/[٫]/g, ".").replace(/[,،٬\s]/g, "");
    return /^\d+(\.\d+)?$/.test(s) ? Number(s) : NaN;
  }
  const or0 = v => isNaN(v) ? 0 : v;

  function addRow() {
    const row = document.createElement("div");
    row.className = "item";
    row.innerHTML =
      '<div class="line"><input class="work" placeholder="العمل" autocomplete="off">' +
      '<button class="x" type="button" aria-label="حذف">✕</button></div>' +
      '<div class="line">' +
        '<div class="field qty"><span class="mini">الكمية</span>' +
        '<input class="q num" value="1" inputmode="decimal" autocomplete="off"></div>' +
        '<div class="field price"><span class="mini">السعر</span>' +
        '<input class="p num" placeholder="0" inputmode="decimal" autocomplete="off"></div>' +
      '</div>' +
      '<div class="rowtotal"><span>المجموع</span><b class="rt"></b></div>';
    row.querySelector(".x").onclick = () => { row.remove(); refresh(); };
    row.querySelectorAll(".q,.p").forEach(i => i.oninput = refresh);
    rows.appendChild(row);
    refresh();
    return row;
  }

  // discount mode: "percent" | "amount"
  let mode = "percent";
  document.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
    mode = b.dataset.mode;
    document.querySelectorAll(".seg button").forEach(x => x.classList.toggle("on", x === b));
    refresh();
  });

  function discountOf(subtotal) {
    const v = or0(num($("discount").value));
    if (!v) return 0;
    return mode === "percent" ? subtotal * v / 100 : v;
  }

  function refresh() {
    const all = [...rows.children];
    all.forEach(r => r.querySelector(".x").disabled = all.length === 1);
    let sub = 0;
    for (const r of all) {
      const line = or0(num(r.querySelector(".q").value)) * or0(num(r.querySelector(".p").value));
      r.querySelector(".rt").textContent = money(line);
      sub += line;
    }
    const off = discountOf(sub);
    $("subtotal").textContent = money(sub);
    $("discRow").classList.toggle("hidden", !off);
    $("discLabel").textContent = mode === "percent"
      ? "الخصم (" + or0(num($("discount").value)) + "%)" : "الخصم";
    $("discAmt").textContent = "− " + money(off);
    $("total").textContent = money(sub - off);
  }

  currency.addEventListener("change", refresh);
  $("discount").addEventListener("input", refresh);
  $("add").onclick = () => addRow().querySelector(".work").focus();
  addRow();

  $("submit").onclick = () => {
    const err = $("err");
    err.textContent = "";
    const name = (client.value === NEW ? newClient.value : client.value).trim();
    if (!name) { err.textContent = "اكتب اسم العميل"; return; }

    const items = [];
    for (const r of rows.children) {
      const work = r.querySelector(".work").value.trim();
      const rawP = r.querySelector(".p").value;
      if (!work && !rawP.trim()) continue;          // an empty row is just ignored
      const qty = num(r.querySelector(".q").value), price = num(rawP);
      if (!work || !(qty > 0) || !(price > 0)) {
        err.textContent = "كل بند يحتاج عمل وكمية وسعر"; return;
      }
      items.push({ work, qty, price });
    }
    if (!items.length) { err.textContent = "أضف بند واحد على الأقل"; return; }

    const rawD = $("discount").value.trim();
    const dv = rawD ? num(rawD) : 0;
    if (isNaN(dv) || dv < 0) { err.textContent = "الخصم لازم رقم"; return; }
    const sub = items.reduce((t, i) => t + i.qty * i.price, 0);
    if (mode === "percent" ? dv >= 100 : dv >= sub) {
      err.textContent = "الخصم أكبر من المجموع"; return;
    }

    const data = JSON.stringify({ t: "invoice", v: 2, client: name, currency: currency.value,
      items, discount: dv ? { value: dv, percent: mode === "percent" } : null });
    if (!tg || !tg.sendData) { err.textContent = "افتحها من زر البوت في تلقرام"; return; }
    tg.sendData(data);   // Telegram closes the form and delivers this to the bot
  };
</script>
</body>
</html>
